[project]
name = "allen-organizer-cad"
version = "0.1.0"
description = "Parametric CadQuery holder for a mixed metric/SAE allen-key collection"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "cadquery>=2.6,<3",
]

[project.scripts]
allen-bin = "allen_organizer.open_bin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/allen_organizer"]
