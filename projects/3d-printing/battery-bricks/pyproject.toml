[project]
name = "battery-bricks-cad"
version = "0.1.0"
description = "Parametric CadQuery Gridfinity battery bricks for a tilted shelf and a flat drawer"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "cadquery>=2.6,<3",
]

[project.scripts]
bricks-coupon = "battery_bricks.coupon:main"
bricks = "battery_bricks.brick:main"
bricks-cradle = "battery_bricks.cradle:main"
bricks-plates = "battery_bricks.plates:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/battery_bricks"]
