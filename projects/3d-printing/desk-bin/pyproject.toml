[project]
name = "desk-bin-cad"
version = "0.1.0"
description = "Rounded-square desk trash can with a swing lid"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "cadquery>=2.6,<3",
]

[project.scripts]
desk-bin-build = "desk_bin.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desk_bin"]
