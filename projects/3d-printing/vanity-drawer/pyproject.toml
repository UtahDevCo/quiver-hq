[project]
name = "vanity-drawer-cad"
version = "0.1.0"
description = "Gridfinity layout for the bathroom vanity drawer: baseplates, boxed bins, razor shadow box"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "cadquery>=2.6,<3",
]

[project.scripts]
drawer-build = "vanity_drawer.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vanity_drawer"]
