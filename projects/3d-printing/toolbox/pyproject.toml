[project]
name = "toolbox-cad"
version = "0.1.0"
description = "Gridfinity baseplate for the razor drawer, plus helpers for Tracefinity-traced bins"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "cadquery>=2.6,<3",
]

[project.scripts]
baseplate = "toolbox_cad.baseplate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolbox_cad"]
